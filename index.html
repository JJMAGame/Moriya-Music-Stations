<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone hero - Moriya Hero Setlist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            padding: 20px;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #2a2a4a;
        }

        .header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #2a2a4a;
            margin-bottom: 25px;
        }

        .header .event-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .rainbow-title {
            font-size: 28px;
            font-weight: 700;
            display: inline-block;
            background: linear-gradient(to right, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff, #ff00ff, #ff0000);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: arco-iris-move 2s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.6));
        }

        @keyframes arco-iris-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .header .subtitle { color: #85c1e9; font-size: 14px; margin-top: 8px; opacity: 0.8; }

        .rainbow-glow {
            animation: arco-iris-move 3s linear infinite !important;
            background: linear-gradient(to right, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff, #ff00ff, #ff0000) !important;
            background-size: 300% 100% !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            font-weight: 700 !important;
            display: inline-block !important;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.6)) !important;
        }

        /* ============================================================
           ETIQUETAS DE DIFICULDADE (1, 2, 3, 4)
        ============================================================ */
        .diff-facil { background-color: #2d7d46 !important; color: #ffffff; font-weight: 600; padding: 2px 10px; border-radius: 20px; display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .diff-medio { background-color: #d4a017 !important; color: #1a1a2e; font-weight: 600; padding: 2px 10px; border-radius: 20px; display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .diff-dificil { background-color: #e74c3c !important; color: #ffffff; font-weight: 600; padding: 2px 10px; border-radius: 20px; display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .diff-expert { background-color: #8e44ad !important; color: #ffffff; font-weight: 600; padding: 2px 10px; border-radius: 20px; display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* ETIQUETA DO NÍVEL (BASE) */
        .badge-base {
            font-weight: 800;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        /* LISTA DE EVENTOS */
        .evento-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #2a2a4a;
            transition: all 0.3s ease;
        }

        .evento-card:hover { border-color: #e94560; }

        .evento-card .evento-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
        }

        .evento-card .evento-titulo h2 {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .evento-card .evento-titulo .evento-badge {
            font-size: 12px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* STATUS */
        .badge-ao-vivo { background: #e74c3c; color: white; animation: glowVermelho 1.5s ease-in-out infinite; box-shadow: 0 0 20px rgba(231, 76, 60, 0.3); }
        @keyframes glowVermelho { 0% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.3); } 50% { box-shadow: 0 0 30px rgba(231, 76, 60, 0.8), 0 0 60px rgba(231, 76, 60, 0.3); } 100% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.3); } }
        .badge-ao-vivo .pulse-dot { display: inline-block; width: 8px; height: 8px; background: white; border-radius: 50%; animation: piscar 1s ease-in-out infinite; }
        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .badge-em-breve { background: #f39c12; color: white; }
        .badge-encerrado { background: #7f8c8d; color: white; }

        /* MAPAS */
        .evento-card .mapa-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            margin: 4px 0;
            background: #0f1a2e;
            border-radius: 6px;
            border-left: 3px solid #e94560;
            transition: all 0.3s ease;
        }

        .evento-card .mapa-item:hover { background: #16213e; transform: translateX(5px); }
        .evento-card .mapa-item .mapa-nome { color: #e0e0e0; font-size: 14px; flex: 1; }
        .evento-card .sem-mapas { color: #7f8c8d; text-align: center; padding: 15px; font-style: italic; }

        /* VÍDEO */
        .video-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #2a2a4a; }
        .video-section .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #0f3460; }
        .video-section .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* BOTÃO VOLTAR */
        .btn-voltar { display: inline-block; background: #0f3460; color: #85c1e9; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.3s ease; margin-top: 10px; border: 1px solid #2a2a4a; text-align: center; }
        .btn-voltar:hover { background: #1a1a4e; transform: scale(1.02); }
        .footer { text-align: center; margin-top: 20px; }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .rainbow-title { font-size: 20px; }
            .evento-card { padding: 15px; }
            .evento-card .evento-titulo { flex-direction: column; align-items: flex-start; }
            .btn-voltar { display: block; }
        }

        @media (max-width: 480px) {
            .evento-card .mapa-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .evento-card .mapa-item .mapa-nome { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="event-badge">🎯 Eventos</span>
            <h1>
                <span class="rainbow-title">Moriya Hero Setlist</span>
            </h1>
            <p class="subtitle">📜 Lista de todas as coletâneas de músicas</p>
        </div>

        <div id="eventosContainer">
            <!-- Os eventos serão carregados do JSON aqui -->
            <div style="color: #85c1e9; text-align: center; padding: 30px;">Carregando eventos...</div>
        </div>

        <div class="footer">
            <a href="index.html" class="btn-voltar">⬅ Voltar para o Tracker</a>
        </div>
    </div>

    <script>
        // Função para calcular a cor do NÍVEL (BASE) de 1 a 99
        function obterCorBase(nivel) {
            let n = Math.max(1, Math.min(99, parseInt(nivel)));
            let r, g, b;

            if (n <= 50) {
                let proporcao = (n - 1) / 49;
                r = 255;
                g = Math.round(255 * (1 - proporcao));
                b = Math.round(255 * (1 - proporcao));
            } else {
                let proporcao = (n - 50) / 49;
                r = Math.round(255 - (proporcao * 55));  // Termina em 200
                g = Math.round(80 + (proporcao * 50));   // Termina em 130
                b = Math.round(80 + (proporcao * 175));  // Termina em 255
            }

            const corTexto = n < 60 ? '#1a1a2e' : '#ffffff';
            return `background-color: rgb(${r}, ${g}, ${b}); color: ${corTexto};`;
        }

        // Função para as ETIQUETAS DE DIFICULDADE (1, 2, 3, 4)
        function renderDifficultyBadges(difficultyString) {
            if (!difficultyString) return '';
            
            const diffs = String(difficultyString).split(',').map(d => d.trim());
            let badgesHtml = '';
            
            diffs.forEach(diff => {
                if (diff === "1") badgesHtml += `<span class="diff-facil">Fácil</span> `;
                else if (diff === "2") badgesHtml += `<span class="diff-medio">Médio</span> `;
                else if (diff === "3") badgesHtml += `<span class="diff-dificil">Difícil</span> `;
                else if (diff === "4") badgesHtml += `<span class="diff-expert">Expert</span> `;
            });
            
            return badgesHtml;
        }

        function getStatusEvento(dataInicio, dataFim) {
            const agora = new Date();
            const inicio = new Date(dataInicio);
            const fim = new Date(dataFim);
            if (agora >= inicio && agora <= fim) return 'ao-vivo';
            else if (agora < inicio) return 'em-breve';
            else return 'encerrado';
        }

        function formatarDataHora(data) {
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function formatarHora(data) {
            const d = new Date(data);
            return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        let eventos = [];

        function renderizarEventos() {
            const container = document.getElementById('eventosContainer');
            
            if (eventos.length === 0) {
                container.innerHTML = `<div style="color: #7f8c8d; text-align: center; padding: 30px;">📭 Nenhum evento cadastrado.</div>`;
                return;
            }
            
            let html = '';
            eventos.forEach((evento) => {
                const status = getStatusEvento(evento.dataInicio, evento.dataFim);
                
                let badgeClass = '';
                let badgeText = '';
                let badgeIcon = '';

                if (status === 'ao-vivo') {
                    badgeClass = 'badge-ao-vivo';
                    badgeText = 'AO VIVO';
                    badgeIcon = '<span class="pulse-dot"></span>';
                } else if (status === 'em-breve') {
                    badgeClass = 'badge-em-breve';
                    badgeText = '📅 EM BREVE';
                } else {
                    badgeClass = 'badge-encerrado';
                    badgeText = '✅ ENCERRADO';
                }

                const tituloClass = evento.rainbow === true ? 'rainbow-glow' : '';
                const tituloIcon = '📌 ';
                
                let mapasHtml = '';
                if (evento.mapas.length === 0) {
                    mapasHtml = '<div class="sem-mapas">📭 Nenhum mapa registrado</div>';
                } else {
                    evento.mapas.forEach(mapa => {
                        // 1. Gera a etiqueta do NÍVEL BASE (1 a 99)
                        const valorBase = mapa.base ? mapa.base : 1;
                        const estiloBase = obterCorBase(valorBase);
                        const baseHtml = `<span class="badge-base" style="${estiloBase}">Nível ${valorBase}</span>`;

                        // 2. Gera as etiquetas de DIFICULDADE (1, 2, 3, 4)
                        const diffsHtml = renderDifficultyBadges(mapa.dificuldade);
                        
                        mapasHtml += `
                            <div class="mapa-item">
                                <span class="mapa-nome">${mapa.nome}</span>
                                <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                                    ${baseHtml}
                                    ${diffsHtml}
                                </div>
                            </div>
                        `;
                    });
                }

                const dataInicioFormatada = formatarDataHora(evento.dataInicio);
                const dataFimFormatada = formatarDataHora(evento.dataFim);
                const horaInicio = formatarHora(evento.dataInicio);
                const horaFim = formatarHora(evento.dataFim);

                let videoHtml = '';
                if (evento.videoId && evento.videoId.trim() !== '') {
                    videoHtml = `
                        <div class="video-section">
                            <div class="video-wrapper">
                                <iframe src="https://www.youtube.com/embed/${evento.videoId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="evento-card">
                        <div class="evento-titulo">
                            <h2>
                                <span class="icon">${tituloIcon}</span>
                                <span class="${tituloClass}">${evento.nome}</span>
                            </h2>
                            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                <span style="color: #85c1e9; font-size: 12px;">📅 ${dataInicioFormatada} ${horaInicio} - ${dataFimFormatada} ${horaFim}</span>
                                <span class="evento-badge ${badgeClass}">${badgeIcon} ${badgeText}</span>
                            </div>
                        </div>
                        ${mapasHtml}
                        ${videoHtml}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        fetch('eventos.json')
            .then(response => {
                if (!response.ok) throw new Error('Erro ao carregar o JSON');
                return response.json();
            })
            .then(data => {
                eventos = data;
                renderizarEventos();
            })
            .catch(error => {
                console.error('Erro:', error);
                document.getElementById('eventosContainer').innerHTML = `
                    <div style="color: #e74c3c; text-align: center; padding: 30px;">
                        ⚠️ Erro ao carregar a lista de eventos.<br>
                        Verifique se o arquivo <strong>eventos.json</strong> está na mesma pasta.
                    </div>
                `;
            });
    </script>
</body>
</html>
